name: Weekly report

# Monday 09:15 IST = 03:45 UTC (offset from the other repo's 09:00 IST).
on:
  schedule:
    - cron: "45 3 * * 1"
  workflow_dispatch: {}

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python report.py --weekly
